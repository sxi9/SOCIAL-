# Local-dev override ONLY — never used in production, so the production file
# keeps its invariant: only caddy publishes host ports. Binds the backing
# stores to loopback so `pnpm dev` (localhost URLs in .env) can reach them.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis minio

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  minio:
    ports:
      - "127.0.0.1:9000:9000"
