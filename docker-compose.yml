# SocialChat — single-VPS deployment (ARCHITECTURE §3).
# Nine services; ONLY caddy publishes host ports — with ONE documented
# exception: `turn` (coturn, v0.6 calls — ADR-014) publishes 3478/udp+tcp and
# the relay range 49160-49200/udp itself, because TURN is UDP-first media
# relay and cannot ride an HTTP reverse proxy. `turn` only starts under the
# "turn" compose profile (COMPOSE_PROFILES=turn in .env, set together with
# TURN_SECRET) and refuses an empty secret — see the service for why.
# One .env (copy .env.example).
# api / worker / migrate share the apps/server image with different commands.
# Local dev (publish postgres/redis/minio on loopback for `pnpm dev`):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis minio

name: socialchat

# .env names the MinIO credentials MINIO_ACCESS_KEY/MINIO_SECRET_KEY; the
# server reads MINIO_ROOT_USER/MINIO_ROOT_PASSWORD — mapped here, one source.
x-server-env: &server-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
  MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

x-server-depends: &server-depends
  migrate:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Host ports are overridable for machines where 80/443 are taken
    # (a laptop running Apache, another proxy, ...): set HTTP_PORT /
    # HTTPS_PORT in .env. Production VPS: leave the defaults.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: socialchat-web
    restart: unless-stopped
    environment:
      # Server-side forward target of app/share/route.ts (Caddy handles
      # browser /api and /ws; this is the only web->api hop in prod).
      API_ORIGIN: http://api:3000
      # Absolute-URL base for link previews (OG tags). Set in .env when the
      # public address can't be derived from headers (tunnels). Empty = derive.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      # v0.8b (API.md §1.69): the baked build identity for the admin update
      # banner — ./bored update passes GIT_COMMIT=$(git rev-parse HEAD).
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: socialchat-server
    command: ["node", "dist/api.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *server-env
      HOST: 0.0.0.0
      PORT: "3000"
    depends_on: *server-depends

  worker:
    image: socialchat-server # built once by the api service
    pull_policy: never
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    env_file: .env
    environment: *server-env
    depends_on: *server-depends

  # Run-once: SQL migrations + MinIO bucket init (removes the boot-race hole).
  migrate:
    image: socialchat-server
    pull_policy: never
    command: ["node", "dist/db/migrate.js"]
    restart: "no"
    env_file: .env
    environment: *server-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # v0.6 calls (ADR-014; API.md §1.42): coturn in static-auth-secret mode. The
  # api mints time-limited credentials from the SAME env TURN_SECRET —
  # username "<unix expiry>:<user_id>", credential base64(HMAC-SHA1(secret,
  # username)) — so api and coturn share only that secret, no DB wiring.
  # THE ONE EXCEPTION to "only caddy publishes host ports": TURN is UDP-first
  # media relay; an HTTP reverse proxy cannot carry it. Open these ports in
  # the host firewall too (README "Deploy"). The relay range is deliberately
  # small (~20 concurrent relayed streams); widen min/max + ports together.
  # Local dev: leave TURN_SECRET (and COMPOSE_PROFILES) empty — the api then
  # returns turn:null and same-network peers connect on host candidates
  # without any relay, and no TURN port is ever published.
  # Host behind NAT (not a plain VPS): add --external-ip=<public-ip> below.
  #
  # OPEN-RELAY GUARD (fixer r1): coturn in static-auth-secret mode with an
  # EMPTY secret would accept any credential HMAC'd with "" — a public open
  # relay on these published ports. Two independent locks:
  #   1. profiles: the service only starts with the "turn" profile active —
  #      set COMPOSE_PROFILES=turn next to TURN_SECRET in .env (README
  #      "Deploy"); the default `docker compose up` never starts it.
  #   2. the entrypoint refuses to start when TURN_SECRET is empty, so even
  #      an explicitly-activated profile can never run an unauthenticated
  #      relay.
  turn:
    image: coturn/coturn:4.6.2-alpine
    restart: unless-stopped
    profiles: ["turn"]
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
    ports:
      - "3478:3478" # TURN_PORT (tcp)
      - "3478:3478/udp" # TURN_PORT (udp)
      - "49160-49200:49160-49200/udp" # TURN_RELAY_PORT_MIN..MAX
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$TURN_SECRET" ]; then
          echo "turn: TURN_SECRET is empty — refusing to start an open relay." >&2
          echo "turn: set TURN_SECRET in .env (openssl rand -hex 32) or drop the 'turn' profile." >&2
          exit 1
        fi
        exec turnserver \
          --listening-port=3478 \
          --min-port=49160 \
          --max-port=49200 \
          --realm=${DOMAIN:-localhost} \
          --use-auth-secret \
          --static-auth-secret="$$TURN_SECRET" \
          --fingerprint \
          --no-cli \
          --no-tlsv1 \
          --no-tlsv1_1

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    # AOF on: queued BullMQ jobs survive restarts (ARCHITECTURE §1)
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    # MinIO ended free image distribution in late 2025 — minio/minio is gone
    # from Docker Hub. bitnamilegacy/minio is the same server (archived
    # Bitnami build, frozen but functional; fine here since MinIO is never
    # exposed outside the compose network). It starts via its own run script
    # and honors MINIO_DATA_DIR; the volume is mounted at both candidate data
    # paths so objects persist regardless of packaging defaults.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    user: "0" # fresh named volumes are root-owned; the image's uid 1001 can't write them
    command: ["/opt/bitnami/scripts/minio/run.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_DATA_DIR: /data
    volumes:
      - minio_data:/data
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || timeout 1 bash -c ':> /dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  minio_data:
